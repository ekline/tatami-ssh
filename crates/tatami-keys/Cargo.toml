[package]
name = "tatami-keys"
description = "SSH key and signature representations and provider contracts for Tatami"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Ed25519 host-key verification (RFC 8709) and SHA-256 fingerprints via
# maintained pure-Rust implementations; portable (no_std + alloc). See
# docs/crypto-provider-audit.md before changing versions or features.
ed25519 = ["dep:ed25519-dalek", "dep:sha2", "dep:base64ct"]
# Read-only OpenSSH known_hosts parsing, matching and trust decisions
# (portable). HMAC-SHA1 is used only for the legacy hashed-hostname format.
known-hosts = ["ed25519", "dep:hmac", "dep:sha1"]
# Unencrypted Ed25519 `openssh-key-v1` private keys decoded from bytes
# (portable; file access belongs to the facade's host layer).
openssh-key = ["ed25519", "dep:ssh-key", "dep:zeroize"]

[dependencies]
tatami-wire = { workspace = true, features = ["alloc"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"], optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }
base64ct = { version = "1.6", default-features = false, features = ["alloc"], optional = true }
hmac = { version = "0.12.1", default-features = false, optional = true }
sha1 = { version = "0.10.7", default-features = false, optional = true }
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc"], optional = true }
zeroize = { version = "1.8", default-features = false, features = ["alloc"], optional = true }
