[package]
name = "tatami"
description = "Reusable SSH client and server composition for Tatami"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Exposes `host::{environment, process, pty}`. Forwards `std` to whichever
# bindings are enabled without itself selecting a transport.
std = ["tatami-tcp?/std", "tatami-quic?/std"]
tcp = ["dep:tatami-tcp"]
quic = ["dep:tatami-quic"]

[dependencies]
tatami-keys = { workspace = true }
tatami-auth = { workspace = true }
tatami-connection = { workspace = true }
tatami-tcp = { workspace = true, optional = true }
tatami-quic = { workspace = true, optional = true }
