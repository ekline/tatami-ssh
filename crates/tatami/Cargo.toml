[package]
name = "tatami"
description = "Reusable SSH client and server composition for Tatami"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Exposes `host::{environment, process, pty}` and `client::probe`. Forwards
# `std` to whichever bindings are enabled without itself selecting a transport.
std = ["tatami-tcp?/std", "tatami-quic?/std"]
tcp = ["dep:tatami-tcp"]
quic = ["dep:tatami-quic"]
# Portable TCP key exchange, host-key verification and packet protection
# (first interoperability profile; see docs/crypto-provider-audit.md).
kex = ["tcp", "tatami-tcp?/kex", "tatami-keys/ed25519"]
# Host-only QUIC/TLS diagnostic handshake backend (quinn-proto + rustls).
# Requires std; pulls ring (C/asm). Enables the tatami-quic-* binaries.
quic-diag = ["std", "quic", "tatami-quic?/quinn-backend"]

[dependencies]
tatami-keys = { workspace = true }
tatami-auth = { workspace = true }
tatami-connection = { workspace = true }
tatami-tcp = { workspace = true, optional = true }
tatami-quic = { workspace = true, optional = true }

[dev-dependencies]
# Test-only: an independent JSON parser to validate JSON Lines output.
# MSRV 1.56; never a dependency of any library target.
serde_json = "1"

[[bin]]
name = "tatami-client"
path = "src/bin/tatami-client.rs"
required-features = ["std", "tcp"]

[[bin]]
name = "tatami-server"
path = "src/bin/tatami-server.rs"
required-features = ["std", "tcp"]

[[bin]]
name = "tatami-quic-client"
path = "src/bin/tatami-quic-client.rs"
required-features = ["quic-diag"]

[[bin]]
name = "tatami-quic-server"
path = "src/bin/tatami-quic-server.rs"
required-features = ["quic-diag"]
