[package]
name = "tatami-quic"
description = "Experimental SSH over QUIC transport binding for Tatami"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Exposes the `io` module: OS socket and runtime adapters. Portable binding
# state does not require this feature.
std = []
# Diagnostic QUIC/TLS handshake backend: quinn-proto (sans-I/O) with rustls
# on the `ring` provider. Requires `std` (rustls and ring need it beyond
# sockets) and pulls C/assembly from `ring`. Absent from default and
# portable builds. See docs/crypto-provider-audit.md and
# docs/quic-observer-readiness.md.
# `tatami-keys/ed25519` is enabled only so the raw-public-key experiment can
# compute an SSH host-key fingerprint next to the certificate/SPKI ones and
# show that they differ; it adds no provider beyond the portable set.
quinn-backend = [
    "std",
    "dep:quinn-proto",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:rcgen",
    "dep:ring",
    "dep:sha2",
    "dep:base64ct",
    "tatami-keys/ed25519",
]

[dependencies]
tatami-wire = { workspace = true, features = ["alloc"] }
tatami-keys = { workspace = true }
tatami-auth = { workspace = true }
tatami-connection = { workspace = true }
quinn-proto = { version = "0.11.18", default-features = false, features = ["rustls-ring", "ring"], optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1.15", default-features = false, features = ["std"], optional = true }
rcgen = { version = "0.13.2", default-features = false, features = ["ring", "pem"], optional = true }
ring = { version = "0.17.14", default-features = false, optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }
base64ct = { version = "1.6", default-features = false, features = ["alloc"], optional = true }
