[package]
name = "tatami_ssh"
description = "Reusable SSH client and server composition for Tatami"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Exposes `host::{environment, process, pty}` and `client::probe`. Forwards
# `std` to whichever bindings are enabled without itself selecting a transport.
std = ["tatami_ssh_tcp?/std", "tatami_ssh_quic?/std"]
tcp = ["dep:tatami_ssh_tcp"]
quic = ["dep:tatami_ssh_quic"]
# Portable TCP key exchange, host-key verification and packet protection
# (first interoperability profile; see docs/crypto-provider-audit.md).
# Also enables read-only known_hosts parsing (portable), used by
# `tatami-client handshake --known-hosts` with `std`.
kex = ["tcp", "tatami_ssh_tcp?/kex", "tatami_ssh_keys/ed25519", "tatami_ssh_keys/known-hosts"]
# Host-only QUIC/TLS diagnostic handshake backend (quinn-proto + rustls).
# Requires std; pulls ring (C/asm). Adds `--transport quic` to the
# tatami-client and tatami-server binaries (which also need `tcp`), with
# SSH host keys as RFC 7250 raw public keys (OpenSSH key files, known_hosts).
quic-diag = [
    "std",
    "quic",
    "tatami_ssh_quic?/quinn-backend",
    "tatami_ssh_keys/known-hosts",
    "tatami_ssh_keys/openssh-key",
]
# RSA host keys (`ssh-rsa` blob, rsa-sha2-512 / rsa-sha2-256 signatures,
# 2048-8192 bits) on both transports: TCP host-signature verification
# through the `ring` provider in `host::signature` (verification only), and
# with `quic-diag` RSA SSH host keys as raw public keys (`--host-key` on the
# server: 2048/3072/4096 bits, what `ring` can sign with). Host-only:
# requires std and pulls ring (C/asm). The `rsa` crate is never used.
rsa = [
    "std",
    "kex",
    "dep:ring",
    "tatami_ssh_keys/rsa",
    "tatami_ssh_quic?/rsa",
]
# ECDSA P-256 host keys (`ecdsa-sha2-nistp256`), same shape as `rsa`.
ecdsa-p256 = [
    "std",
    "kex",
    "dep:ring",
    "tatami_ssh_keys/ecdsa-p256",
    "tatami_ssh_quic?/ecdsa-p256",
]
# Legacy OpenSSH hashed host names (`|1|salt|hash`, HMAC-SHA1) in
# `--known-hosts` files. Off by default and deliberately not part of `kex` or
# `quic-diag`: without it a hashed entry is an explicit
# `unsupported_configuration` error. SHA-1 is reachable only through
# `tatami_ssh_openssh_compat` (checked by scripts/check-sha1-boundary.py).
openssh-hashed-hosts = ["tatami_ssh_keys/openssh-hashed-hosts"]

[dependencies]
tatami_ssh_keys = { workspace = true }
tatami_ssh_auth = { workspace = true }
tatami_ssh_connection = { workspace = true }
tatami_ssh_tcp = { workspace = true, optional = true }
tatami_ssh_quic = { workspace = true, optional = true }
# Host adapter only (features `rsa` / `ecdsa-p256`): RSA PKCS#1 v1.5 and
# ECDSA P-256 signature *verification* for the TCP handshake. The same
# version rustls already uses; no signing or key generation happens here.
ring = { version = "0.17.14", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
# Test-only: an independent JSON parser to validate JSON Lines output.
# MSRV 1.56; never a dependency of any library target.
serde_json = "1"
# Test-only: decoding fixture public keys.
base64ct = { version = "1.6", features = ["alloc"] }

[[bin]]
name = "tatami-client"
path = "src/bin/tatami-client.rs"
required-features = ["std", "tcp"]

[[bin]]
name = "tatami-server"
path = "src/bin/tatami-server.rs"
required-features = ["std", "tcp"]
