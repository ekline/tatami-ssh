name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.85.0"
          - stable
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal \
            --component rustfmt,clippy --target thumbv7em-none-eabi
          rustup default ${{ matrix.toolchain }}
          cargo --version
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
      - name: Install OpenSSH (interoperability fixtures)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server openssh-client
          # Privilege-separation directory sshd expects even when it runs
          # unprivileged on a loopback test port.
          sudo mkdir -p /run/sshd
          /usr/sbin/sshd -V 2>&1 || true
      - name: Workspace checks
        run: scripts/check-workspace.sh
        env:
          CHECK_EMBEDDED_REQUIRED: "1"
          # OpenSSH interop tests must run, never skip, in CI.
          TATAMI_REQUIRE_OPENSSH: "1"
