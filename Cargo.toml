[workspace]
resolver = "3"
members = ["crates/*"]
# Fuzz harnesses are isolated Cargo workspaces with their own lockfiles and
# nightly-only build flags; they are never part of the production graph.
exclude = ["fuzz/wire-core", "fuzz/protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ekline/tatami-ssh"
publish = false

# Every in-tree dependency is a path dependency with default features disabled.
# Consumers opt into `tatami_ssh_wire/alloc` and the binding/facade `std` features
# explicitly; see docs/architecture.md.
[workspace.dependencies]
tatami_ssh_wire = { path = "crates/tatami_ssh_wire", default-features = false }
tatami_ssh_keys = { path = "crates/tatami_ssh_keys", default-features = false }
tatami_ssh_auth = { path = "crates/tatami_ssh_auth", default-features = false }
tatami_ssh_connection = { path = "crates/tatami_ssh_connection", default-features = false }
tatami_ssh_tcp = { path = "crates/tatami_ssh_tcp", default-features = false }
tatami_ssh_quic = { path = "crates/tatami_ssh_quic", default-features = false }
tatami_ssh_openssh_compat = { path = "crates/tatami_ssh_openssh_compat", default-features = false }
