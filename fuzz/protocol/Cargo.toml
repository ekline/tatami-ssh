[package]
name = "tatami_ssh_fuzz_protocol"
version = "0.0.0"
edition = "2024"
publish = false
description = "libFuzzer harnesses for tatami_ssh_tcp, tatami_ssh_connection and the tatami_ssh facade"

[package.metadata]
cargo-fuzz = true

# Isolated workspace: not a member of the production workspace.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# Independent JSON parser used only as an oracle.
serde_json = "1"
tatami_ssh_wire = { path = "../../crates/tatami_ssh_wire", default-features = false, features = ["alloc"] }
# `openssh-hashed-hosts` keeps hashed-name matching covered by the
# `known_hosts` target (through `tatami_ssh_openssh_compat`). `rsa` and
# `ecdsa-p256` add the round-6 host-key types (parsing, policy, scheme
# binding; the final check goes to a harness mock `SignatureProvider`). They
# are enabled here only, not on the facade, whose `rsa`/`ecdsa-p256`
# features pull `ring`.
tatami_ssh_keys = { path = "../../crates/tatami_ssh_keys", default-features = false, features = ["ed25519", "rsa", "ecdsa-p256", "known-hosts", "openssh-key", "openssh-hashed-hosts"] }
tatami_ssh_tcp = { path = "../../crates/tatami_ssh_tcp", default-features = false, features = ["std", "kex"] }
tatami_ssh_connection = { path = "../../crates/tatami_ssh_connection", default-features = false }
tatami_ssh = { path = "../../crates/tatami_ssh", default-features = false, features = ["std", "tcp", "kex"] }
# Harness-only cryptographic providers, used as INDEPENDENT oracles: the
# harness plays the server (X25519 agreement, Ed25519 signing over its own
# exchange-hash computation, AES-GCM sealing, RFC 4253 §7.2 derivation with
# `sha2` directly). Versions equal the production lockfile; none of these is
# a dependency of a production package through this manifest. There is no
# private key in any seed: keys are derived from fuzz bytes at run time.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"] }
sha2 = { version = "0.10.9", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
# SHA-1 under the harness's own RFC 2104 HMAC, the independent reference
# for hashed known_hosts names (`known_hosts` target); harness-only, same
# version as the production lockfile.
sha1 = { version = "0.10.7", default-features = false }

[profile.release]
debug = 1
overflow-checks = true
debug-assertions = true

