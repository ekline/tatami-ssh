[package]
name = "tatami-fuzz-protocol"
version = "0.0.0"
edition = "2024"
publish = false
description = "libFuzzer harnesses for tatami-tcp, tatami-connection and the tatami facade"

[package.metadata]
cargo-fuzz = true

# Isolated workspace: not a member of the production workspace.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# Independent JSON parser used only as an oracle.
serde_json = "1"
tatami-wire = { path = "../../crates/tatami-wire", default-features = false, features = ["alloc"] }
tatami-keys = { path = "../../crates/tatami-keys", default-features = false, features = ["ed25519"] }
tatami-tcp = { path = "../../crates/tatami-tcp", default-features = false, features = ["std", "kex"] }
tatami-connection = { path = "../../crates/tatami-connection", default-features = false }
tatami = { path = "../../crates/tatami", default-features = false, features = ["std", "tcp", "kex"] }
# Harness-only cryptographic providers, used as INDEPENDENT oracles: the
# harness plays the server (X25519 agreement, Ed25519 signing over its own
# exchange-hash computation, AES-GCM sealing, RFC 4253 §7.2 derivation with
# `sha2` directly). Versions equal the production lockfile; none of these is
# a dependency of a production package through this manifest. There is no
# private key in any seed: keys are derived from fuzz bytes at run time.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"] }
sha2 = { version = "0.10.9", default-features = false }
rand_core = { version = "0.6.4", default-features = false }

[profile.release]
debug = 1
overflow-checks = true
debug-assertions = true

[[bin]]
name = "tcp_identification"
path = "fuzz_targets/tcp_identification.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_initial_packets"
path = "fuzz_targets/tcp_initial_packets.rs"
test = false
doc = false
bench = false

